# H2 — console disabled by default for security; enable via 'dev' profile
spring.h2.console.enabled=false
spring.h2.console.path=/h2
# Datasource — credentials externalized via environment variables
spring.datasource.url=jdbc:h2:file:./target/BaseDatos/prueba;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
server.port=8082

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
