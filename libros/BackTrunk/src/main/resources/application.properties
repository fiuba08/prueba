# H2 — console disabled for security (enable only in dev profile)
spring.h2.console.enabled=false
# Datasource — credentials externalized via environment variables
spring.datasource.url=jdbc:h2:file:./target/BaseDatos/prueba;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
server.port=8082
