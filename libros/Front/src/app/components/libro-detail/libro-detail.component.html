<div class="container mt-4">
  <h2>Libro Detail</h2>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <div *ngIf="libro" class="card">
    <div class="card-header">
      <h4>{{ libro.titulo }}</h4>
    </div>
    <div class="card-body">
      <table class="table table-borderless">
        <tbody>
          <tr>
            <th scope="row" class="text-muted" style="width: 200px;">ID</th>
            <td>{{ libro.id }}</td>
          </tr>
          <tr>
            <th scope="row" class="text-muted">Titulo</th>
            <td>{{ libro.titulo }}</td>
          </tr>
          <tr>
            <th scope="row" class="text-muted">Autor</th>
            <td>{{ libro.autor }}</td>
          </tr>
          <tr>
            <th scope="row" class="text-muted">Precio</th>
            <td>{{ libro.precio | number:'1.2-2' }}</td>
          </tr>
          <tr>
            <th scope="row" class="text-muted">Fecha Lanzamiento</th>
            <td>{{ libro.fechaLanzamiento }}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer">
      <button class="btn btn-warning mr-2" (click)="editLibro()">
        <i class="fa fa-edit"></i> Edit
      </button>
      <button class="btn btn-secondary" (click)="goBack()">
        <i class="fa fa-arrow-left"></i> Back to List
      </button>
    </div>
  </div>
</div>
